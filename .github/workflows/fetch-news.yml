# =============================================================================
# Daily News Dashboard — Data Fetcher
#
# Runs daily at 08:00 Beijing time (00:00 UTC) to fetch finance and AI
# data, then commits the merged result to news.json.
#
# Secrets required (set in GitHub repo → Settings → Secrets and variables → Actions):
#   - FINNHUB_KEY        (https://finnhub.io/  — free tier: 60 calls/min)
#   - GNEWS_KEY          (https://gnews.io/    — free tier: 100 calls/day)
#   - TENCENT_SECRET_ID  (Tencent Cloud API key for TMT translation)
#   - TENCENT_SECRET_KEY (Tencent Cloud API secret for TMT translation)
# =============================================================================

name: Fetch Daily News

on:
  schedule:
    # 00:00 UTC = 08:00 Beijing time. Adjust if your timezone differs.
    - cron: '0 0 * * *'
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out claude_source branch
        uses: actions/checkout@v4
        with:
          ref: claude_source
          # Fetch full history so we can push without force
          fetch-depth: 0

      - name: Calculate yesterday's date (ISO)
        id: dates
        run: |
          echo "yesterday=$(date -d 'yesterday' '+%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "now=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------------
      # 1. FINANCE — Finnhub API
      # ------------------------------------------------------------------
      - name: Fetch Finance News
        id: finance
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: |
          if [ -z "$FINNHUB_KEY" ]; then
            echo 'finance=[]' >> $GITHUB_OUTPUT
            echo "::warning::FINNHUB_KEY is not set — finance data will be empty"
            exit 0
          fi
          RESP=$(curl -s --max-time 15 \
            "https://finnhub.io/api/v1/news?category=general&token=${FINNHUB_KEY}")
          echo 'finance<<FINFIN' >> $GITHUB_OUTPUT
          echo "$RESP" >> $GITHUB_OUTPUT
          echo 'FINFIN' >> $GITHUB_OUTPUT

      # ------------------------------------------------------------------
      # 2. AI — GNews API
      # ------------------------------------------------------------------
      - name: Fetch AI News
        id: ai
        env:
          GNEWS_KEY: ${{ secrets.GNEWS_KEY }}
        run: |
          if [ -z "$GNEWS_KEY" ]; then
            echo 'ai=[]' >> $GITHUB_OUTPUT
            echo "::warning::GNEWS_KEY is not set — AI data will be empty"
            exit 0
          fi
          RESP=$(curl -s --max-time 15 \
            "https://gnews.io/api/v4/search?q=artificial%20intelligence&token=${GNEWS_KEY}&lang=en&max=10")
          echo 'ai<<GNEWS' >> $GITHUB_OUTPUT
          echo "$RESP" >> $GITHUB_OUTPUT
          echo 'GNEWS' >> $GITHUB_OUTPUT

      # ------------------------------------------------------------------
      # 3. Transform & Merge → news.json
      # ------------------------------------------------------------------
      - name: Build news.json
        uses: actions/github-script@v7
        env:
          FINANCE_RAW: ${{ steps.finance.outputs.finance }}
          AI_RAW: ${{ steps.ai.outputs.ai }}
          NOW: ${{ steps.dates.outputs.now }}
        with:
          script: |
            const fs = require('fs');

            const now = process.env.NOW;
            let financeRaw = process.env.FINANCE_RAW || '[]';
            let aiRaw = process.env.AI_RAW || '{}';
            // ---- Parse finance (max 5 items) ----
            let finance = [];
            try {
              const parsed = JSON.parse(financeRaw);
              if (Array.isArray(parsed)) {
                finance = parsed.filter(item => item.source === 'CNBC').slice(0, 10).map(item => ({
                  title: item.headline || item.title || '',
                  summary: item.summary || '',
                  url: item.url || '',
                  source: item.source || '',
                  datetime: item.datetime || 0,
                  image: item.image || ''
                }));
              }
            } catch (e) {
              console.warn('Failed to parse finance data:', e.message);
            }

            // ---- Parse AI (max 5 items) ----
            let ai = [];
            try {
              const parsed = JSON.parse(aiRaw);
              const articles = parsed.articles || [];
              ai = articles.map(item => ({
                title: item.title || '',
                description: item.description || '',
                url: item.url || '',
                source: (item.source && item.source.name) || item.source || '',
                publishedAt: item.publishedAt || '',
                image: item.image || ''
              }));
            } catch (e) {
              console.warn('Failed to parse AI data:', e.message);
            }

            // ---- Deduplicate by title (keeps first occurrence) ----
            function deduplicate(arr) {
              const seen = new Set();
              return arr.filter(item => {
                if (seen.has(item.title)) return false;
                seen.add(item.title);
                return true;
              });
            }
            finance = deduplicate(finance).slice(0, 5);
            ai = deduplicate(ai).slice(0, 5);

            // ---- Build output ----
            const datePart = now.slice(0, 10).replace(/-/g, '');
            const output = { lastUpdated: now, finance: finance, ai: ai };
            fs.mkdirSync('news', { recursive: true });
            fs.writeFileSync(`news/news_${datePart}.json`, JSON.stringify(output, null, 2) + '\n');
            console.log(`news/news_${datePart}.json written with ${finance.length} finance, ${ai.length} AI items`);

      # ------------------------------------------------------------------
      # 4. Translate — Tencent Cloud TMT API (Chinese)
      # ------------------------------------------------------------------
      - name: Translate to Chinese
        uses: actions/github-script@v7
        env:
          NOW: ${{ steps.dates.outputs.now }}
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');

            const now = process.env.NOW;
            const SECRET_ID = process.env.TENCENT_SECRET_ID;
            const SECRET_KEY = process.env.TENCENT_SECRET_KEY;

            if (!SECRET_ID || !SECRET_KEY) {
              console.log('TENCENT_SECRET_ID/KEY not set — skipping translation');
              return;
            }

            // ── Utility: SHA-256 ──
            function sha256(msg) {
              return crypto.createHash('sha256').update(msg).digest('hex');
            }
            function hmacSha256(key, msg) {
              return crypto.createHmac('sha256', key).update(msg).digest();
            }

            // ── Tencent Cloud Signature v3 ──
            function buildAuthorization(payload, secretId, secretKey) {
              const nowSec = Math.floor(Date.now() / 1000);
              const date = new Date(nowSec * 1000).toISOString().slice(0, 10);
              const service = 'tmt';
              const algorithm = 'TC3-HMAC-SHA256';
              const contentType = 'application/json';
              const host = 'tmt.tencentcloudapi.com';
              const signedHeaders = 'content-type;host';

              const canonicalRequest = [
                'POST', '/', '',
                'content-type:' + contentType,
                'host:' + host, '',
                signedHeaders,
                sha256(payload),
              ].join('\n');

              const credentialScope = `${date}/${service}/tc3_request`;
              const stringToSign = [
                algorithm,
                nowSec.toString(),
                credentialScope,
                sha256(canonicalRequest),
              ].join('\n');

              const secretDate = hmacSha256('TC3' + secretKey, date);
              const secretService = hmacSha256(secretDate, service);
              const signingKey = hmacSha256(secretService, 'tc3_request');
              const signature = hmacSha256(signingKey, stringToSign).toString('hex');

              return {
                authorization: `${algorithm} Credential=${secretId}/${credentialScope}, SignedHeaders=${signedHeaders}, Signature=${signature}`,
                timestamp: nowSec,
              };
            }

            // ── Call TMT API ──
            async function translateText(text) {
              if (!text || !text.trim()) return '';
              const payload = JSON.stringify({
                SourceText: text, Source: 'en', Target: 'zh', ProjectId: 0,
              });
              const { authorization, timestamp } = buildAuthorization(payload, SECRET_ID, SECRET_KEY);

              const url = new URL('https://tmt.tencentcloudapi.com');
              const res = await fetch(url, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Host': 'tmt.tencentcloudapi.com',
                  'Authorization': authorization,
                  'X-TC-Action': 'TextTranslate',
                  'X-TC-Version': '2018-03-21',
                  'X-TC-Region': 'ap-guangzhou',
                  'X-TC-Timestamp': timestamp.toString(),
                },
                body: payload,
              });

              const data = await res.json();
              if (data.Response && data.Response.TargetText !== undefined) {
                return data.Response.TargetText;
              }
              if (data.Response && data.Response.Error) {
                throw new Error(`${data.Response.Error.Code}: ${data.Response.Error.Message}`);
              }
              throw new Error('Unexpected response: ' + JSON.stringify(data).slice(0, 200));
            }

            // ── Main ──
            const datePart = now.slice(0, 10).replace(/-/g, '');
            const filePath = `news/news_${datePart}.json`;

            if (!fs.existsSync(filePath)) {
              console.log(`File not found: ${filePath} — skipping translation`);
              return;
            }

            const data = JSON.parse(fs.readFileSync(filePath, 'utf-8'));
            const totalItems = (data.finance?.length || 0) + (data.ai?.length || 0);
            if (totalItems === 0) {
              console.log('No items to translate — skipping');
              return;
            }

            console.log(`Translating ${totalItems} items...`);

            // Translate finance
            for (let i = 0; i < (data.finance?.length || 0); i++) {
              const item = data.finance[i];
              try {
                if (item.title) item.title_cn = await translateText(item.title);
                if (item.summary) item.summary_cn = await translateText(item.summary);
                process.stdout.write('.');
              } catch (e) {
                console.warn(`\n  ⚠ Finance[${i}] translation failed: ${e.message}`);
                item.title_cn = item.title_cn || '';
                item.summary_cn = item.summary_cn || '';
              }
            }

            // Translate AI
            for (let i = 0; i < (data.ai?.length || 0); i++) {
              const item = data.ai[i];
              try {
                if (item.title) item.title_cn = await translateText(item.title);
                if (item.description) item.description_cn = await translateText(item.description);
                process.stdout.write('.');
              } catch (e) {
                console.warn(`\n  ⚠ AI[${i}] translation failed: ${e.message}`);
                item.title_cn = item.title_cn || '';
                item.description_cn = item.description_cn || '';
              }
            }

            fs.writeFileSync(filePath, JSON.stringify(data, null, 2) + '\n');
            console.log(`\n✅ Translation complete — ${filePath}`);

      # ------------------------------------------------------------------
      # 5. Commit & Push
      # ------------------------------------------------------------------
      - name: Commit and push news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add news/
          # Only commit if something changed
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto-update news/news_* [skip ci]"
          git push
